services:
  - type: worker
    name: yukki-bot
    runtime: image
    repo: https://github.com/kingali371/YukkiMusicsBot
    branch: main
    dockerfilePath: ./Dockerfile
    envVars:
      - key: API_ID
        sync: false
      - key: API_HASH
        sync: false
      - key: BOT_TOKEN
        sync: false
      - key: STRING_SESSION
        sync: false
      - key: MONGO_DB_URI
        sync: false
      - key: OWNER_ID
        sync: false

services:
  - type: worker
    name: yukki-music-bot
    runtime: image
    repo: https://github.com/kingali371/YukkiMusicsBot
    branch: main
    dockerfilePath: ./Dockerfile
    envVars:
      # === المتغيرات الإجبارية ===
      - key: API_ID
        sync: false
        required: true
      - key: API_HASH
        sync: false
        required: true
      - key: BOT_TOKEN
        sync: false
        required: true
      - key: STRING_SESSION
        sync: false
        required: true
      - key: MONGO_DB_URI
        sync: false
        required: true
      - key: OWNER_ID
        sync: false
        required: true
      
      # === المتغيرات الاختيارية المهمة ===
      - key: MUSIC_BOT_NAME
        sync: false
        required: false
      - key: LOG_GROUP_ID
        sync: false
        required: false
      - key: UPSTREAM_REPO
        value: https://github.com/kingali371/YukkiMusicsBot
        required: false
      
      # === إعدادات إضافية ===
      - key: PYTHON_VERSION
        value: 3.9.18
        required: false
